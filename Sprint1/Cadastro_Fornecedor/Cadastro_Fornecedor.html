<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclypse Cadastro Fornecedor</title>
    <link rel="icon" type="image/x-icon" href="img/icone.jpg">
    <link rel="stylesheet" href="Cadastro_Fornecedor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header><img src="img/logo.png" alt=""></header>
    <main>
        <div class="container">
            <h1><a href="/Main/Main.html"><i class="fa-solid fa-arrow-left"></i></a>Cadastro de Fornecedores</h1>
            <div class="nome">
                <label for="nomeinput">Nome:</label>
                <input type="text" id="nomeinput">
            </div>
            <div class="cnpj">
                <label for="cnpjinput">CNPJ ou CPF:</label>
                <input type="password" id="cnpjinput">
            </div>
            <div class="endereço">
                <label for="adressinput">Endereço:</label>
                <input type="text" id="adressinput">
            </div>
            <div class="telefone">
                <label for="telefoneinput">Telefone:</label>
                <input type="tel" id="telefoneinput">
            </div>
            <div class="email">
                <label for="emailinput">E-mail:</label>
                <input type="email" id="emailinput">
            </div>
            <div class="observações">
                <label for="observationinput">Observações:</label>
                <textarea name="observation" id="observationinput"></textarea>
            </div>
            <h2>Cadastrar</h2>
            <h3>Listagem de Fornecedores</h3>
            <table>
                <th>id</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Ações</th>
            </table>
        </div>
    </main>
    <footer>
        <img src="img/logo.png" alt="">
        <ul>
            <li><a href="https://site.pecararabrecho.com.br/sobre-nos/">Sobre Nós</a></li>
            <li><a href="https://site.pecararabrecho.com.br/fornecedores/">Fornecedores</a></li>
            <li><a href="https://sejafranqueado.pecararabr.com.br/sejafranqueado">Franquias</a></li>
        </ul>
        <div class="icons">
            <a href="https://www.instagram.com/pecararabr/?hl=en"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/pecararabsb/?locale=pt_BR"></a><i class="fa-brands fa-facebook-f"></i>
        </div>
    </footer>
</body>
</html>
