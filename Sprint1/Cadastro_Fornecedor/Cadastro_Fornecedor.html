<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclypse Cadastro Fornecedor</title>
    <link rel="stylesheet" href="Cadastro_Fornecedor.css">
</head>
<body>
    <header><img src="img/peça_rara_logo.png" alt=""></header>
    <br><br>
    <main>
        <div class="container">
            <h1>Cadastro de Fornecedor</h1>
            <div class="nome">
                <label for="nomeinput">Nome:</label>
                <input type="text" id="nomeinput">
            </div>
            <div class="cnpj">
                <label for="cnpjinput">CNPJ ou CPF:</label>
                <input type="password" id="cnpjinput">
            </div>
            <div class="endereço">
                <label for="adressinput">Endereço:</label>
                <input type="text" id="adressinput">
            </div>
            <div class="telefone">
                <label for="telefoneinput">Telefone:</label>
                <input type="tel" id="telefoneinput">
            </div>
            <div class="email">
                <label for="emailinput">E-mail:</label>
                <input type="email" id="emailinput">
            </div>
            <div class="observações">
                <label for="observationinput">Observações:</label>
                <textarea name="observation" id="observationinput"></textarea>
            </div>
            <h2>Cadastrar</h2>
            <h3>Listagem de Fornecedores</h3>
            <table>
                <th>id</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Ações</th>
            </table>
        </div>
    </main>
    <br><br>
    <footer>
        
    </footer>
</body>
</html>
