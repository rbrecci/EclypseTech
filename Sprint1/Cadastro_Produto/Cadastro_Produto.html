<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclypse Cadastro de Produtos</title>
    <link rel="icon" type="image/x-icon" href="img/icone.jpg">
    <link rel="stylesheet" href="Cadastro_Produto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header><img src="img/logo.png" alt=""></header>
    <main>
        <div class="container">
            <h1><a href="/Main/Main.html"><i class="fa-solid fa-arrow-left"></i></a>Cadastro de Produtos</h1>
            <div class="nome">
                <label for="nomeinput">Nome:</label>
                <input type="text" id="nomeinput">
            </div>
            <div class="CNPJ">
                <label for="cnpjinput">Código:</label>
                <input type="password" id="cnpjinput">
            </div>
            <div class="Endereço">
                <label for="adressinput">Descrição:</label>
                <input type="text" id="adressinput">
            </div>
            <div class="telefone">
                <label for="telefoneinput">Quantidade em Estoque:</label>
                <input type="password" id="telefoneinput">
            </div>
            <div class="price">
                <label for="priceinput">Preço Unitário:</label>
                <input type="text" id="priceinput">
            </div>
            <div class="fornecedor">
                <label for="fornecedorselect">Fornecedor:</label>
                <select name="fornecedor" id="fornecedorselect">
                    <option value="none"> </option>
                    <option value="Fornecedor1">Fornecedor 1</option>
                    <option value="Fornecedor2">Fornecedor 2</option>
                    <option value="Fornecedor3">Fornecedor 3</option>
                </select>
            </div>
            <h2>Cadastrar</h2>
            <h3>Listagem de Produtos</h3>
            <table>
                <th>Nome</th>
                <th>Código</th>
                <th>Descrição</th>
                <th>Estoque</th>
                <th>Preço</th>
            </table>
        </div>
    </main>
   <footer>
        <img src="img/logo.png" alt="">
        <ul>
            <li><a href="https://site.pecararabrecho.com.br/sobre-nos/">Sobre Nós</a></li>
            <li><a href="https://site.pecararabrecho.com.br/fornecedores/">Fornecedores</a></li>
            <li><a href="https://sejafranqueado.pecararabr.com.br/sejafranqueado">Franquias</a></li>
        </ul>
        <div class="icons">
            <a href="https://www.instagram.com/pecararabr/?hl=en"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/pecararabsb/?locale=pt_BR"></a><i class="fa-brands fa-facebook-f"></i>
        </div>
    </footer>
</body>
</html>
