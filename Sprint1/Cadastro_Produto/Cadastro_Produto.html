<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclypse Cadastro de Produtos</title>
    <link rel="stylesheet" href="Cadastro_Produto.css">
</head>
<body>
    <header><img src="img/peça_rara_logo.png" alt=""></header>
    <br><br>
    <main>
        <div class="container">
            <h1>Cadastro de Produtos</h1>
            <div class="nome">
                <label for="nomeinput">Nome:</label>
                <input type="text" id="nomeinput">
            </div>
            <div class="CNPJ">
                <label for="cnpjinput">Código:</label>
                <input type="password" id="cnpjinput">
            </div>
            <div class="Endereço">
                <label for="adressinput">Descrição:</label>
                <input type="text" id="adressinput">
            </div>
            <div class="telefone">
                <label for="telefoneinput">Quantidade em Estoque:</label>
                <input type="password" id="telefoneinput">
            </div>
            <div class="price">
                <label for="priceinput">Preço Unitário:</label>
                <input type="text" id="priceinput">
            </div>
            <div class="fornecedor">
                <label for="fornecedorselect">Fornecedor:</label>
                <select name="fornecedor" id="fornecedorselect">
                    <option value="none"> </option>
                    <option value="Fornecedor1">Fornecedor 1</option>
                    <option value="Fornecedor2">Fornecedor 2</option>
                    <option value="Fornecedor3">Fornecedor 3</option>
                </select>
            </div>
            <h2>Cadastrar</h2>
            <h3>Listagem de Produtos</h3>
            <table>
                <th>Nome</th>
                <th>Código</th>
                <th>Descrição</th>
                <th>Estoque</th>
                <th>Preço</th>
            </table>
        </div>
    </main>
    <br><br>
    <footer></footer>
</body>
</html>
